<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title> Music Player</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1 class="heading"> Music Player</h1>

<div class="player-box">

    <img id="cover" class="cover" 
         src="https://images.pexels.com/photos/164879/pexels-photo-164879.jpeg" />

    <h2 id="title">Relaxing Piano</h2>

    <audio id="audio" 
           src="music/song1.mp3">
    </audio>

    <input type="range" id="progress" />

    <div class="controls">
        <button onclick="prevSong()">⏮</button>
        <button id="playBtn" onclick="playPause()">▶</button>
        <button onclick="nextSong()">⏭</button>
    </div>
</div>


<h2 class="real-title"> Listen to REAL Songs</h2>

<div class="real-music">

    
    <iframe style="border-radius:12px"
        src="https://open.spotify.com/embed/track/7tFiyTwD0nx5a1eklYtX2J"
        width="100%" height="152" frameBorder="0"
        allowfullscreen
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>

    
    <iframe 
        width="100%" height="220"
        src="https://www.youtube.com/embed/2OEL4P1Rz04"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>

</div>

<script src="script.js"></script>
</body>
</html>
